<!doctype html><meta charset="utf-8"><title>JAGAU — film direction review</title><style>body{margin:0;background:#151c18;color:#eee;font:15px system-ui}header{display:flex;flex-wrap:wrap;gap:20px;padding:20px;align-items:center}button{font:inherit;background:#e8eee5;color:#182b20;border:0;padding:10px 18px;border-radius:5px;cursor:pointer}video{display:block;width:100%;max-height:78vh}#status{margin-left:auto}footer{padding:18px;color:#a5b6a8}</style><header><b>JAGAU / Film review</b><button data-film="labstock">LabStock A</button><button data-film="labstock-focus">LabStock B</button><button data-film="suhulog">SuhuLog</button><button data-film="bdrs">BDRS</button><button id="play">Play / pause</button><span id="status">Paused</span></header><video id="film" controls playsinline src="labstock.mp4" poster="labstock.jpg"></video><footer>Editable React scenes · illustrative UI · synthetic demonstration. 1920 × 1080 · 30 fps · 16 seconds.</footer><script>const v=document.querySelector('video');document.querySelectorAll('[data-film]').forEach(b=>b.onclick=()=>{v.src=b.dataset.film+'.mp4';v.poster=b.dataset.film+'.jpg';v.play()});document.querySelector('#play').onclick=()=>v.paused?v.play():v.pause();v.ontimeupdate=()=>document.querySelector('#status').textContent=v.currentTime.toFixed(2)+' / '+v.duration.toFixed(0)+' s · '+(v.paused?'paused':'playing');</script>
