name: JAGAU four-destination navigation
on:
  pull_request:
    paths:
      - 'tests/browser/navigation.spec.ts'
      - '.github/workflows/navigation-qa.yml'
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test tests/browser/navigation.spec.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jagau-navigation-review
          path: |
            artifacts/navigation-browser/
            docs/release/workspace-browser-results.json
            test-results/
