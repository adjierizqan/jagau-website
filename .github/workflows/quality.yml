name: JAGAU release gates
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jagau-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jagau-release-evidence
          path: docs/release/
      - uses: actions/upload-artifact@v4
        with:
          name: jagau-static-export
          path: out/
