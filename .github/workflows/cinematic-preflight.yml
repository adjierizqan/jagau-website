name: Cinematic preparation
on:
  push:
    branches: [experiment/cinematic-ui]
    paths: [.github/workflows/cinematic-preflight.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          npm audit --json > audit-before.json || true
          cat audit-before.json
          npm view remotion version license peerDependencies --json
          npm view @remotion/cli version license --json
          npm view motion version license peerDependencies --json
          npm view next version --json
          npm view skills version license scripts --json
      - name: Install official text skills in temporary sandbox
        run: |
          mkdir /tmp/remotion-skills-review
          cd /tmp/remotion-skills-review
          git init -q
          npx --yes skills add remotion-dev/skills --skill remotion-best-practices remotion-create remotion-markup remotion-render --agent codex --copy --yes
          find . -type f | sort
          find . -type f -exec sha256sum {} \;
          git status --short
      - name: Preview credential availability (presence only)
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          node -e 'for(const k of ["CF_TOKEN","CF_ACCOUNT","VERCEL_TOKEN"]) console.log(k+"="+Boolean(process.env[k]))'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cinematic-preflight
          path: |
            audit-before.json
            /tmp/remotion-skills-review/.agents
            /tmp/remotion-skills-review/skills-lock.json
