name: Dependency security audit
on:
  pull_request:
    paths: ['package.json', 'package-lock.json', '.github/workflows/cinematic-preflight.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Record full and runtime audit without automatic dependency rewrites
        run: |
          npm audit --json > audit-full.json || true
          npm audit --omit=dev --json > audit-runtime.json || true
          cat audit-full.json
          cat audit-runtime.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-security-audit
          path: |
            audit-full.json
            audit-runtime.json
