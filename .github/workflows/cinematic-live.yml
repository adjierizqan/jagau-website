name: Cinematic HTTPS preview verification
on:
  pull_request:
    paths: ['.github/workflows/cinematic-live.yml', 'scripts/capture-cinematic.mjs']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QA_BASE_URL: https://experiment-cinematic-ui.jagau-cinematic-preview.pages.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Read public HTTPS response
        run: |
          curl --fail --show-error --location --dump-header /tmp/preview-headers.txt "$QA_BASE_URL" --output /tmp/preview.html
          cat /tmp/preview-headers.txt
          head -c 600 /tmp/preview.html
      - name: Live desktop mobile keyboard and reduced motion
        run: npx playwright test tests/browser/cinematic.spec.ts tests/browser/premium.spec.ts tests/browser/navigation.spec.ts
      - name: Record live playback and loading
        run: node scripts/capture-cinematic.mjs
      - name: Runtime dependency audit
        if: always()
        run: npm audit --omit=dev --json > artifacts/runtime-audit.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cinematic-live-https-evidence
          path: |
            artifacts/cinematic-qa/
            artifacts/runtime-audit.json
            docs/release/workspace-browser-results.json
            test-results/
